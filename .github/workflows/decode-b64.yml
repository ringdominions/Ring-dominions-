name: decode-b64
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 files
        run: |
          shopt -s globstar nullglob
          changed=0
          for f in b64/**/*.b64; do
            out="nft/images/$(basename "${f%.b64}")"
            mkdir -p nft/images
            base64 -d "$f" > "$out"
            rm "$f"
            changed=1
          done
          echo "changed=$changed" >> $GITHUB_ENV
      - name: Commit decoded files
        if: env.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decode uploaded NFT images"
          git push
